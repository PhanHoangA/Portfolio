<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1329" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGrad1)" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#334155" stroke-width="0.7" opacity="0.3">
    <line x1="0" y1="40" x2="600" y2="40" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="280" x2="600" y2="280" />
    <line x1="60" y1="0" x2="60" y2="340" />
    <line x1="120" y1="0" x2="120" y2="340" />
    <line x1="180" y1="0" x2="180" y2="340" />
    <line x1="240" y1="0" x2="240" y2="340" />
    <line x1="300" y1="0" x2="300" y2="340" />
    <line x1="360" y1="0" x2="360" y2="340" />
    <line x1="420" y1="0" x2="420" y2="340" />
    <line x1="480" y1="0" x2="480" y2="340" />
    <line x1="540" y1="0" x2="540" y2="340" />
  </g>

  <!-- Browser/Window Mockup Frame -->
  <g transform="translate(40, 30)">
    <!-- Window Container -->
    <rect width="520" height="280" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.5))" />
    
    <!-- Window Header -->
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 36 L 0 36 Z" fill="#0f172a" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <rect x="140" y="8" width="240" height="20" rx="6" fill="#1e293b" />
    <text x="260" y="22" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">smashstore.local/products</text>
    
    <!-- Store UI Layout -->
    <!-- Sidebar -->
    <rect x="16" y="50" width="110" height="215" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="30" y="75" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CATEGORIES</text>
    <rect x="26" y="88" width="90" height="18" rx="4" fill="#1e293b" />
    <text x="32" y="101" fill="#e2e8f0" font-family="sans-serif" font-size="10">🏸 Rackets (48)</text>
    <text x="32" y="125" fill="#94a3b8" font-family="sans-serif" font-size="10">👟 Shoes (24)</text>
    <text x="32" y="147" fill="#94a3b8" font-family="sans-serif" font-size="10">👕 Apparel (36)</text>
    <text x="32" y="169" fill="#94a3b8" font-family="sans-serif" font-size="10">🎒 Bags &amp; Gear</text>
    <text x="32" y="191" fill="#94a3b8" font-family="sans-serif" font-size="10">⚙️ Strings</text>

    <!-- Admin / DB badge -->
    <rect x="24" y="222" width="94" height="26" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="0.8" />
    <text x="71" y="238" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">ROLE: ADMIN</text>

    <!-- Main Storefront Area -->
    <!-- Search and Filter Bar -->
    <rect x="140" y="50" width="250" height="28" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="155" y="68" fill="#64748b" font-family="sans-serif" font-size="11">🔍 Search Yonex, Victor, Li-Ning...</text>
    <rect x="400" y="50" width="105" height="28" rx="6" fill="#2563eb" />
    <text x="452" y="68" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🛒 Cart: 2 items</text>

    <!-- Product Card 1 -->
    <rect x="140" y="90" width="175" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="150" y="100" width="155" height="75" rx="6" fill="#1e293b" />
    <!-- Badminton racket icon -->
    <circle cx="215" cy="130" r="18" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <line x1="228" y1="143" x2="250" y2="165" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 205 130 L 225 130 M 215 120 L 215 140" stroke="#0284c7" stroke-width="1" />
    <text x="150" y="193" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Yonex Astrox 88D Pro</text>
    <text x="150" y="210" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">$199.99</text>
    <text x="250" y="210" fill="#10b981" font-family="sans-serif" font-size="10">In Stock</text>
    <rect x="150" y="222" width="155" height="24" rx="4" fill="#2563eb" />
    <text x="227" y="238" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add to Cart</text>

    <!-- Product Card 2 -->
    <rect x="330" y="90" width="175" height="175" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="340" y="100" width="155" height="75" rx="6" fill="#1e293b" />
    <circle cx="405" cy="130" r="18" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <line x1="418" y1="143" x2="440" y2="165" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
    <path d="M 395 130 L 415 130 M 405 120 L 405 140" stroke="#d97706" stroke-width="1" />
    <text x="340" y="193" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Victor Thruster K</text>
    <text x="340" y="210" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">$175.50</text>
    <text x="440" y="210" fill="#10b981" font-family="sans-serif" font-size="10">In Stock</text>
    <rect x="340" y="222" width="155" height="24" rx="4" fill="#2563eb" />
    <text x="417" y="238" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Add to Cart</text>
  </g>

  <!-- Tech Floating Tag -->
  <g transform="translate(420, 20)">
    <rect width="150" height="28" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
    <text x="75" y="18" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">⚡ Java • Servlet • SQL</text>
  </g>
</svg>
