<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradNet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGradNet)" />

  <!-- Grid lines -->
  <g stroke="#3730a3" stroke-width="0.7" opacity="0.3">
    <line x1="0" y1="40" x2="600" y2="40" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="280" x2="600" y2="280" />
  </g>

  <!-- Windows/WPF App Window Frame -->
  <g transform="translate(40, 25)">
    <rect width="520" height="290" rx="8" fill="#0f172a" stroke="#4338ca" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))" />
    
    <!-- Title bar (Windows style) -->
    <path d="M 0 8 Q 0 0 8 0 L 512 0 Q 520 0 520 8 L 520 32 L 0 32 Z" fill="#1e1b4b" />
    <text x="16" y="21" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">FPT Student Attendance Manager — WPF v2.4 [.NET 8]</text>
    <!-- Windows min, max, close buttons -->
    <text x="450" y="20" fill="#94a3b8" font-family="sans-serif" font-size="12">―</text>
    <text x="475" y="20" fill="#94a3b8" font-family="sans-serif" font-size="12">□</text>
    <text x="500" y="20" fill="#ef4444" font-family="sans-serif" font-size="12">✕</text>

    <!-- Toolbar / Menu -->
    <rect x="0" y="32" width="520" height="26" fill="#171e33" />
    <text x="16" y="49" fill="#94a3b8" font-family="sans-serif" font-size="10">File    Edit    Courses    Attendance    Reports    Database Sync (Connected)</text>

    <!-- Left Navigation Tree -->
    <rect x="12" y="66" width="115" height="212" rx="6" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <text x="22" y="85" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">C# / .NET SYSTEM</text>
    <text x="22" y="108" fill="#e2e8f0" font-family="sans-serif" font-size="10">📁 .NET 8 Desktop</text>
    <text x="22" y="130" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">▶ PRN211 (C# WPF)</text>
    <text x="32" y="148" fill="#94a3b8" font-family="sans-serif" font-size="9">└ Class SE1801</text>
    <text x="32" y="164" fill="#94a3b8" font-family="sans-serif" font-size="9">└ Class SE1802</text>
    <text x="22" y="186" fill="#e2e8f0" font-family="sans-serif" font-size="10">📁 DBI202 (SQL)</text>
    <text x="22" y="208" fill="#e2e8f0" font-family="sans-serif" font-size="10">📁 SWP391 (Project)</text>

    <!-- DataGrid View for Attendance -->
    <g transform="translate(138, 66)">
      <!-- Table Header -->
      <rect width="370" height="26" rx="4" fill="#1e1b4b" stroke="#312e81" stroke-width="0.8" />
      <text x="10" y="17" fill="#c7d2fe" font-family="sans-serif" font-size="10" font-weight="bold">Roll No</text>
      <text x="75" y="17" fill="#c7d2fe" font-family="sans-serif" font-size="10" font-weight="bold">Student Name</text>
      <text x="180" y="17" fill="#c7d2fe" font-family="sans-serif" font-size="10" font-weight="bold">Slot 1</text>
      <text x="235" y="17" fill="#c7d2fe" font-family="sans-serif" font-size="10" font-weight="bold">Slot 2</text>
      <text x="290" y="17" fill="#c7d2fe" font-family="sans-serif" font-size="10" font-weight="bold">Rate</text>

      <!-- Row 1 -->
      <rect y="30" width="370" height="24" rx="3" fill="#111827" />
      <text x="10" y="46" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">HE170024</text>
      <text x="75" y="46" fill="#ffffff" font-family="sans-serif" font-size="10">Nguyen Hoang An</text>
      <rect x="180" y="34" width="38" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)" />
      <text x="199" y="46" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Present</text>
      <rect x="235" y="34" width="38" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)" />
      <text x="254" y="46" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Present</text>
      <text x="300" y="46" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">100%</text>

      <!-- Row 2 -->
      <rect y="58" width="370" height="24" rx="3" fill="#1e293b" />
      <text x="10" y="74" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">HE170088</text>
      <text x="75" y="74" fill="#ffffff" font-family="sans-serif" font-size="10">Tran Minh Duc</text>
      <rect x="180" y="62" width="38" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)" />
      <text x="199" y="74" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Present</text>
      <rect x="235" y="62" width="38" height="16" rx="3" fill="rgba(239, 68, 68, 0.2)" />
      <text x="254" y="74" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">Absent</text>
      <text x="300" y="74" fill="#f59e0b" font-family="sans-serif" font-size="9" font-weight="bold">87.5%</text>

      <!-- Row 3 -->
      <rect y="86" width="370" height="24" rx="3" fill="#111827" />
      <text x="10" y="102" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">HE170112</text>
      <text x="75" y="102" fill="#ffffff" font-family="sans-serif" font-size="10">Le Quang Huy</text>
      <rect x="180" y="90" width="38" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)" />
      <text x="199" y="102" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Present</text>
      <rect x="235" y="90" width="38" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)" />
      <text x="254" y="102" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Present</text>
      <text x="300" y="102" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">95.0%</text>

      <!-- Row 4 -->
      <rect y="114" width="370" height="24" rx="3" fill="#1e293b" />
      <text x="10" y="130" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">HE170154</text>
      <text x="75" y="130" fill="#ffffff" font-family="sans-serif" font-size="10">Pham Mai Chi</text>
      <rect x="180" y="118" width="38" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)" />
      <text x="199" y="130" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Present</text>
      <rect x="235" y="118" width="38" height="16" rx="3" fill="rgba(16, 185, 129, 0.2)" />
      <text x="254" y="130" fill="#34d399" font-family="sans-serif" font-size="9" text-anchor="middle">Present</text>
      <text x="300" y="130" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold">100%</text>

      <!-- Bottom controls -->
      <rect y="150" width="130" height="28" rx="4" fill="#4f46e5" />
      <text x="65" y="168" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">💾 Save Changes</text>
      <rect x="140" y="150" width="110" height="28" rx="4" fill="#1e293b" stroke="#3730a3" stroke-width="1" />
      <text x="195" y="168" fill="#c7d2fe" font-family="sans-serif" font-size="10" text-anchor="middle">📊 Export Excel</text>
    </g>
  </g>

  <!-- .NET Tag -->
  <g transform="translate(420, 15)">
    <rect width="150" height="26" rx="13" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
    <text x="75" y="17" fill="#c7d2fe" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">🔷 C# • WPF • EF Core</text>
  </g>
</svg>
