<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCinema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGradCinema)" />

  <!-- Grid lines -->
  <g stroke="#374151" stroke-width="0.7" opacity="0.3">
    <line x1="0" y1="40" x2="600" y2="40" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="280" x2="600" y2="280" />
  </g>

  <!-- C# / ASP.NET Core Top-Left Floating Badge (does not collide with card top-right badge) -->
  <g transform="translate(40, 10)">
    <rect width="180" height="26" rx="13" fill="#030712" stroke="#6366f1" stroke-width="1.2" />
    <text x="90" y="17" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">🔷 C# • ASP.NET Core • MVC</text>
  </g>

  <!-- Window Frame -->
  <g transform="translate(40, 42)">
    <rect width="520" height="275" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))" />
    
    <!-- Title bar -->
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 34 L 0 34 Z" fill="#030712" />
    <circle cx="20" cy="17" r="5" fill="#ef4444" />
    <circle cx="36" cy="17" r="5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="5" fill="#10b981" />
    <rect x="140" y="7" width="240" height="20" rx="6" fill="#1f2937" />
    <text x="260" y="21" fill="#9ca3af" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">cinemax.aspnet.local/booking/hall-3</text>
    
    <!-- Movie Info Ribbon -->
    <rect x="20" y="44" width="480" height="40" rx="8" fill="#1e293b" />
    <text x="35" y="65" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">🎬 Interstellar (IMAX 2D)</text>
    <text x="35" y="78" fill="#94a3b8" font-family="sans-serif" font-size="10">Hall 03 • Today 19:30 - 22:15 • English (VN Sub)</text>
    <rect x="390" y="51" width="95" height="24" rx="6" fill="#818cf8" />
    <text x="437" y="67" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">$12.50 / seat</text>

    <!-- Curved Cinema Screen -->
    <path d="M 90 108 Q 260 90 430 108" stroke="#38bdf8" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <text x="260" y="100" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">CINEMA SCREEN</text>

    <!-- Seat Matrix -->
    <g transform="translate(100, 118)">
      <!-- Row A -->
      <rect x="10" y="0" width="18" height="18" rx="4" fill="#334155" />
      <rect x="36" y="0" width="18" height="18" rx="4" fill="#334155" />
      <rect x="62" y="0" width="18" height="18" rx="4" fill="#ef4444" />
      <rect x="88" y="0" width="18" height="18" rx="4" fill="#ef4444" />
      <rect x="130" y="0" width="18" height="18" rx="4" fill="#334155" />
      <rect x="156" y="0" width="18" height="18" rx="4" fill="#334155" />
      <rect x="182" y="0" width="18" height="18" rx="4" fill="#334155" />
      <rect x="208" y="0" width="18" height="18" rx="4" fill="#334155" />
      <rect x="250" y="0" width="18" height="18" rx="4" fill="#334155" />
      <rect x="276" y="0" width="18" height="18" rx="4" fill="#334155" />
      <rect x="302" y="0" width="18" height="18" rx="4" fill="#334155" />

      <!-- Row B -->
      <rect x="10" y="25" width="18" height="18" rx="4" fill="#334155" />
      <rect x="36" y="25" width="18" height="18" rx="4" fill="#334155" />
      <rect x="62" y="25" width="18" height="18" rx="4" fill="#334155" />
      <rect x="88" y="25" width="18" height="18" rx="4" fill="#334155" />
      <rect x="130" y="25" width="18" height="18" rx="4" fill="#2563eb" />
      <rect x="156" y="25" width="18" height="18" rx="4" fill="#2563eb" />
      <rect x="182" y="25" width="18" height="18" rx="4" fill="#334155" />
      <rect x="208" y="25" width="18" height="18" rx="4" fill="#334155" />
      <rect x="250" y="25" width="18" height="18" rx="4" fill="#ef4444" />
      <rect x="276" y="25" width="18" height="18" rx="4" fill="#ef4444" />
      <rect x="302" y="25" width="18" height="18" rx="4" fill="#334155" />

      <!-- Row C -->
      <rect x="10" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="36" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="62" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="88" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="130" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="156" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="182" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="208" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="250" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="276" y="50" width="18" height="18" rx="4" fill="#334155" />
      <rect x="302" y="50" width="18" height="18" rx="4" fill="#334155" />
    </g>

    <!-- Legend -->
    <g transform="translate(130, 198)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#334155" />
      <text x="18" y="10" fill="#94a3b8" font-family="sans-serif" font-size="10">Available</text>
      <rect x="85" y="0" width="12" height="12" rx="3" fill="#2563eb" />
      <text x="103" y="10" fill="#38bdf8" font-family="sans-serif" font-size="10">Selected (B5, B6)</text>
      <rect x="210" y="0" width="12" height="12" rx="3" fill="#ef4444" />
      <text x="228" y="10" fill="#94a3b8" font-family="sans-serif" font-size="10">Booked</text>
    </g>

    <!-- Checkout Bar -->
    <rect x="20" y="222" width="480" height="34" rx="6" fill="#1e293b" />
    <text x="35" y="244" fill="#e2e8f0" font-family="sans-serif" font-size="11">Selected: <tspan fill="#38bdf8" font-weight="bold">Hall 03 / Seats B5, B6</tspan> • Total: <tspan fill="#10b981" font-weight="bold">$25.00</tspan></text>
    <rect x="375" y="227" width="115" height="24" rx="4" fill="#2563eb" />
    <text x="432" y="243" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Confirm Order</text>
  </g>
</svg>
