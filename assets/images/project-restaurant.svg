<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradRest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGradRest)" />

  <!-- Grid lines -->
  <g stroke="#1e293b" stroke-width="0.7" opacity="0.4">
    <line x1="0" y1="40" x2="600" y2="40" />
    <line x1="0" y1="80" x2="600" y2="80" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="160" x2="600" y2="160" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="280" x2="600" y2="280" />
  </g>

  <!-- Window Frame -->
  <g transform="translate(40, 25)">
    <rect width="520" height="290" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.6))" />
    
    <!-- Title bar -->
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 36 L 0 36 Z" fill="#022c22" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <rect x="140" y="8" width="240" height="20" rx="6" fill="#064e3b" opacity="0.8" />
    <text x="260" y="22" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">api.bistro.io/v1/reservations</text>
    
    <!-- Top Action / Stat Bar -->
    <g transform="translate(20, 50)">
      <rect width="150" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="15" y="67" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">18 / 24</text>
      <text x="15" y="83" fill="#94a3b8" font-family="sans-serif" font-size="10">Active Bookings Today</text>

      <rect x="165" width="150" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="180" y="67" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">6 Tables</text>
      <text x="180" y="83" fill="#94a3b8" font-family="sans-serif" font-size="10">Available for 19:00 - 21:00</text>

      <rect x="330" width="150" height="42" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="345" y="67" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold">Spring Boot 3</text>
      <text x="345" y="83" fill="#94a3b8" font-family="sans-serif" font-size="10">JPA Repository &amp; MySQL</text>
    </g>

    <!-- Table Floorplan View -->
    <g transform="translate(20, 105)">
      <rect width="480" height="135" rx="8" fill="#09131e" stroke="#1e293b" stroke-width="1" />
      
      <!-- Table 1 (Reserved) -->
      <g transform="translate(20, 18)">
        <rect width="90" height="95" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
        <circle cx="45" cy="40" r="20" fill="#334155" />
        <text x="45" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">T-01</text>
        <rect x="12" y="70" width="66" height="16" rx="4" fill="rgba(239, 68, 68, 0.2)" />
        <text x="45" y="82" fill="#ef4444" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">RESERVED</text>
      </g>

      <!-- Table 2 (Available) -->
      <g transform="translate(135, 18)">
        <rect width="90" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <circle cx="45" cy="40" r="20" fill="#065f46" />
        <text x="45" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">T-02</text>
        <rect x="12" y="70" width="66" height="16" rx="4" fill="rgba(16, 185, 129, 0.2)" />
        <text x="45" y="82" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">AVAILABLE</text>
      </g>

      <!-- Table 3 (VIP - Reserved) -->
      <g transform="translate(250, 18)">
        <rect width="90" height="95" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
        <circle cx="45" cy="40" r="20" fill="#3730a3" />
        <text x="45" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VIP-1</text>
        <rect x="12" y="70" width="66" height="16" rx="4" fill="rgba(129, 140, 248, 0.2)" />
        <text x="45" y="82" fill="#a5b4fc" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">OCCUPIED</text>
      </g>

      <!-- Table 4 (Available) -->
      <g transform="translate(365, 18)">
        <rect width="90" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
        <circle cx="45" cy="40" r="20" fill="#065f46" />
        <text x="45" y="44" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">T-04</text>
        <rect x="12" y="70" width="66" height="16" rx="4" fill="rgba(16, 185, 129, 0.2)" />
        <text x="45" y="82" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">AVAILABLE</text>
      </g>
    </g>

    <!-- Bottom Status Log -->
    <rect x="20" y="249" width="480" height="28" rx="6" fill="#064e3b" opacity="0.6" />
    <text x="35" y="267" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10">HTTP POST /api/reservations/confirm → 201 Created (Duration: 24ms)</text>
  </g>

  <!-- Spring Badge -->
  <g transform="translate(415, 15)">
    <rect width="155" height="26" rx="13" fill="#022c22" stroke="#10b981" stroke-width="1.2" />
    <text x="77" y="17" fill="#6ee7b7" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" text-anchor="middle">🍃 Spring Boot • JPA</text>
  </g>
